name: assemble-werkstatt
on:
  workflow_dispatch:
  push:
    paths:
      - "src/components/werkstatt/.upload/**"
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble
        run: |
          set -euo pipefail
          UP=src/components/werkstatt/.upload
          if compgen -G "$UP/section.part.*" > /dev/null; then
            cat $UP/section.part.* > src/components/werkstatt/werkstatt-section.tsx
          fi
          if compgen -G "$UP/css.part.*" > /dev/null; then
            cat $UP/css.part.* > src/components/werkstatt/werkstatt.css
          fi
          rm -rf "$UP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Werkstatt: inset overview canvas to free space for station pills"
          git push
